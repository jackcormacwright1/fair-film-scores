[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filmscore"
version = "0.1.0"
description = "Film scores that allow for how many ratings, and whose, each film has: partial pooling on MovieLens 32M, tested against a known answer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jack Wright" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=7", "tabulate>=0.9", "matplotlib>=3.7"]
app = ["streamlit>=1.50", "altair>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
